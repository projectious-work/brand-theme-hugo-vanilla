baseURL = "https://projectious-work.github.io/brand-theme-hugo-vanilla/"
languageCode = "en"
defaultContentLanguage = "en"
title = "projectious.work"
enableRobotsTXT = true

[module]
  [[module.imports]]
    path = "github.com/projectious-work/hugo-theme-projectious"

[pagination]
  pagerSize = 8

[taxonomies]
  tag = "tags"

[outputFormats.SearchIndex]
  mediaType = "application/json"
  baseName = "index"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "RSS", "SearchIndex"]

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    lineNos = false
    guessSyntax = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[[menus.main]]
  name = "Docs"
  pageRef = "/docs"
  weight = 10

[[menus.main]]
  name = "Blog"
  pageRef = "/blog"
  weight = 20

[[menus.main]]
  name = "Changelog"
  pageRef = "/changelog"
  weight = 30

[[menus.main]]
  name = "About"
  pageRef = "/about"
  weight = 40

[[menus.main]]
  name = "GitHub"
  url = "https://github.com/projectious-work"
  weight = 50
  [menus.main.params]
    external = true

[params]
  description = "Cloud · Agile · Agentic AI. Agent-first consulting. We run what we recommend."

  [params.search]
    placement = "header"

  [params.giscus]
    repo = ""
    repoId = ""
    categoryId = ""

  [[params.social]]
    name = "GitHub"
    url = "https://github.com/projectious-work"

[languages]
  [languages.en]
    languageName = "English"
    weight = 1
  [languages.de]
    languageName = "Deutsch"
    weight = 2
