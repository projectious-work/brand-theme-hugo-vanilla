baseURL = "https://projectious-work.github.io/brand-theme-hugo-vanilla/"
locale = "en-US"
defaultContentLanguage = "en"
title = "projectious.work"
enableRobotsTXT = true

[module]
  [[module.imports]]
    path = "github.com/projectious-work/hugo-theme-projectious"

[pagination]
  pagerSize = 8

[taxonomies]
  tag = "tags"

[outputFormats.SearchIndex]
  mediaType = "application/json"
  baseName = "index"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "RSS", "SearchIndex"]

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    lineNos = false
    guessSyntax = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[[menus.main]]
  name = "Docs"
  pageRef = "/docs"
  weight = 10

[[menus.main]]
  name = "Examples"
  pageRef = "/examples"
  weight = 20

[[menus.main]]
  name = "Blog"
  pageRef = "/blog"
  weight = 30

[[menus.main]]
  name = "Changelog"
  pageRef = "/changelog"
  weight = 40

[[menus.main]]
  name = "GitHub"
  url = "https://github.com/projectious-work"
  weight = 50
  [menus.main.params]
    external = true

[params]
  description = "Documentation and examples for the projectious.work Hugo theme."

  [params.search]
    placement = "header"

  [params.giscus]
    repo = ""
    repoId = ""
    categoryId = ""

  [[params.social]]
    name = "GitHub"
    url = "https://github.com/projectious-work"

[languages]
  [languages.en]
    label = "English"
    weight = 1
  [languages.de]
    label = "Deutsch"
    weight = 2
