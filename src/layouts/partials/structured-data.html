{{- $record := partial "page-record.html" . -}}
{{- $data := dict
  "@context" "https://schema.org"
  "@type" (cond .IsPage "TechArticle" "WebSite")
  "name" $record.title
  "description" $record.description
  "url" $record.url
  "inLanguage" $record.language
-}}
<script type="application/ld+json">{{ $data | jsonify | safeJS }}</script>
