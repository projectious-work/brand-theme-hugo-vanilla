{{- /* One dialog per page; interactions.js wires every .prose img to it. */ -}}
<div class="lightbox" data-lightbox data-open="false" role="dialog" aria-modal="true" aria-label="{{ i18n "imageViewer" }}">
  <button class="lightbox__close" type="button" data-lightbox-close aria-label="{{ i18n "close" }}">
    {{ partial "icon.html" (dict "name" "x" "class" "ico--sm") }}
  </button>
  <figure><img src="" alt=""><figcaption hidden></figcaption></figure>
</div>
