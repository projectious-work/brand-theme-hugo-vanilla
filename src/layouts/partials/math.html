{{- $base := "https://cdn.jsdelivr.net/npm/katex@0.18.4/dist" -}}
<link rel="stylesheet" href="{{ $base }}/katex.min.css" crossorigin="anonymous">
<script defer src="{{ $base }}/katex.min.js" crossorigin="anonymous"></script>
<script defer src="{{ $base }}/contrib/auto-render.min.js" crossorigin="anonymous" onload="renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false},{left:'$',right:'$',display:false}]})"></script>
