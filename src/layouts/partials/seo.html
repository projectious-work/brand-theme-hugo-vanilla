{{- $desc := or .Description .Summary site.Params.description -}}
<meta name="description" content="{{ $desc | plainify | truncate 180 }}">
<meta property="og:site_name" content="{{ site.Title }}">
<meta property="og:title" content="{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }}{{ end }}">
<meta property="og:description" content="{{ $desc | plainify | truncate 180 }}">
<meta property="og:type" content="{{ if eq .Kind "page" }}article{{ else }}website{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta name="twitter:card" content="summary">
{{ with .Params.images }}<meta property="og:image" content="{{ index . 0 | absURL }}">{{ end }}
{{ if .IsTranslated }}{{ range .AllTranslations }}<link rel="alternate" hreflang="{{ .Language.LanguageCode }}" href="{{ .Permalink }}">
{{ end }}{{ end }}<link rel="canonical" href="{{ .Permalink }}">
