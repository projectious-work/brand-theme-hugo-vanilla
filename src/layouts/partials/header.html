<header class="site-header">
  <div class="container site-header__inner">
    {{ partial "brand.html" (dict "page" . "class" "") }}
    <button class="nav-toggle" data-nav-toggle aria-label="{{ i18n "menu" }}" aria-expanded="false" aria-controls="site-nav">{{ partial "icon.html" (dict "name" "menu" "size" 24) }}</button>
    <div class="site-header__right" id="site-nav" data-nav>
      {{ partial "menu.html" . }}
      {{ $searchPlacement := "header" }}
      {{ with site.Params.search }}{{ with .placement }}{{ $searchPlacement = . }}{{ end }}{{ end }}
      {{ if eq $searchPlacement "header" }}{{ partial "search-box.html" . }}{{ end }}
      <button class="theme-toggle" data-theme-toggle aria-label="{{ i18n "toggleTheme" }}" type="button">
        {{ partial "icon.html" (dict "name" "sun" "size" 20 "class" "theme-toggle__sun") }}
        {{ partial "icon.html" (dict "name" "moon" "size" 20 "class" "theme-toggle__moon") }}
      </button>
    </div>
  </div>
</header>
