{{ if not (eq site.Params.search false) }}
<div class="searchbox" data-search data-empty="{{ i18n "noResults" }}">
  {{ partial "icon.html" (dict "name" "search" "class" "ico--sm") }}
  <input type="search" placeholder="{{ i18n "searchPlaceholder" }}" aria-label="{{ i18n "search" }}" autocomplete="off">
  <kbd>{{ i18n "searchShortcut" }}</kbd>
  <div class="results" role="listbox" aria-label="{{ i18n "search" }}"></div>
</div>
{{ end }}
