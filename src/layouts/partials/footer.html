<footer class="site-footer">
  <div class="container site-footer__inner">
    {{ partial "brand.html" (dict "page" . "class" "brand--sm") }}
    <div class="site-footer__meta caption">
      <span>© {{ now.Year }} {{ site.Title }}</span>
      {{ range site.Params.social }}<a href="{{ .url }}" target="_blank" rel="noopener">{{ .name }}</a>{{ end }}
    </div>
  </div>
</footer>
