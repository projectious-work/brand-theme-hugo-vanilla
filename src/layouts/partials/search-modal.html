<div class="search-modal" data-search-modal role="dialog" aria-modal="true" aria-label="{{ i18n "search" }}" hidden>
  <div class="search-modal__panel">
    <div class="search-modal__input-row">
      {{ partial "icon.html" (dict "name" "search" "size" 20) }}
      <input type="text" data-search-input class="search-modal__input" placeholder="{{ i18n "searchPlaceholder" }}" aria-label="{{ i18n "searchPlaceholder" }}" autocomplete="off">
      <button class="search-modal__close" data-search-close type="button" aria-label="{{ i18n "closeSearch" }}">{{ partial "icon.html" (dict "name" "x" "size" 20) }}</button>
    </div>
    <div class="search-modal__results" data-search-results data-empty-text="{{ i18n "noResults" }}" aria-live="polite"></div>
  </div>
</div>
