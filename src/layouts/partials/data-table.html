{{- $rows := .rows | default (slice) -}}
{{- $columns := .columns | default (slice) -}}
{{- $label := .label | default (i18n "table") -}}
<div class="tablewrap" tabindex="0" role="region" aria-label="{{ $label }}">
  <table>
    <thead><tr>{{ range $columns }}<th scope="col">{{ .label }}</th>{{ end }}</tr></thead>
    <tbody>
      {{ range $rows }}{{ $row := . }}
      <tr>{{ range $columns }}<td>{{ index $row .key }}</td>{{ end }}</tr>
      {{ end }}
    </tbody>
  </table>
</div>
