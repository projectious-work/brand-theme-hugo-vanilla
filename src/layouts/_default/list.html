{{ define "main" }}
<div class="shell">
  <main id="main">
    {{ partial "breadcrumbs.html" . }}
    <article class="prose">
      <h1>{{ .Title }}</h1>
      {{ with .Description }}<p class="lede">{{ . }}</p>{{ end }}
      {{ .Content }}
    </article>
    {{ partial "child-cards.html" . }}
  </main>
</div>
{{ end }}
