{{ define "main" }}
<div class="container">
  <header class="section-header">
    <h1>{{ .Title }}</h1>
    {{ with .Content }}<div class="section-desc content">{{ . }}</div>{{ end }}
  </header>
  {{ if .Pages }}
  <div class="card-grid">
    {{ range .Pages }}
    <a class="card" href="{{ .RelPermalink }}">
      <div class="card__body">
        <div class="card__title">{{ .Title }}</div>
        {{ with .Summary }}<div class="card__desc">{{ . | plainify | truncate 140 }}</div>{{ end }}
      </div>
    </a>
    {{ end }}
  </div>
  {{ end }}
</div>
{{ end }}
