<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode }}" dir="{{ or site.Language.LanguageDirection "ltr" }}" data-a11y="auto"{{ with site.Params.darkSurface }} data-surface="{{ . }}"{{ end }} data-search-index="{{ "index.json" | relLangURL }}">
<head>{{ partial "head.html" . }}</head>
<body>
  <a class="skip-link" href="#main">{{ i18n "skipToContent" }}</a>
  {{ partial "header.html" . }}
  {{ block "main" . }}{{ end }}
  {{ partial "footer.html" . }}
  {{ partial "scripts.html" . }}
</body>
</html>
