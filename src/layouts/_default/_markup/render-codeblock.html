{{- $result := transform.HighlightCodeBlock . -}}
<div class="code-block">
  <div class="code-block__header">
    <span class="code-block__lang">{{ .Type }}</span>
    {{ with .Attributes.filename }}<span class="code-block__filename">{{ . }}</span>{{ end }}
    <button class="code-block__copy" type="button" aria-label="{{ i18n "copyCode" }}">{{ partial "icon.html" (dict "name" "copy" "size" 14) }}</button>
  </div>
  {{ $result.Wrapped }}
</div>
