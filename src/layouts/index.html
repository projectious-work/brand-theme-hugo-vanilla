{{ define "main" }}
<section class="hero">
  <div class="container hero__inner">
    {{ with .Params.eyebrow }}<div class="overline">{{ . }}</div>{{ end }}
    <h1 class="display hero__title">{{ .Title }}</h1>
    {{ with .Params.tagline }}<p class="body-l hero__tagline">{{ . }}</p>{{ end }}
    {{ with .Params.cta }}
    <div class="hero__ctas">
      {{ range . }}<a class="btn btn--{{ .variant | default "primary" }}" href="{{ .href }}">{{ .label }}</a>{{ end }}
    </div>
    {{ end }}
  </div>
</section>
<div class="container">
  <div class="content">{{ .Content }}</div>
</div>
{{ end }}
