# Third-party runtime dependencies, pinned to exact versions. A floating major can
# change under a build that has already been reviewed, so every URL names a full
# version.
#
# No Subresource Integrity: KaTeX and asciinema ship as multi-file bundles that
# fetch siblings at runtime (fonts, chunks), which a hash on the entry file cannot
# cover, and jsdelivr does not publish stable per-file digests we could vendor
# here without fetching at build time. Exact pinning is the guarantee this file
# makes; if you need cryptographic assurance, use selfHostAssets below and serve
# the files yourself.
#
# Bumping a pin: change version and base together, then re-check rendered output —
# Mermaid in particular changes diagram defaults between minors.
#
# selfHostAssets: set params.selfHostAssets = true and place the same files under
# static/vendor/<name>/ for deployments that prohibit public CDNs. Nothing is
# bundled by default.
katex:
  version: "0.18.4"
  base: "https://cdn.jsdelivr.net/npm/katex@0.18.4/dist"
  local: "vendor/katex"
  files:
    css: "katex.min.css"
    js: "katex.min.js"
    autorender: "contrib/auto-render.min.js"
    autorenderLocal: "auto-render.min.js"
mermaid:
  version: "11.16.1"
  base: "https://cdn.jsdelivr.net/npm/mermaid@11.16.1/dist"
  local: "vendor/mermaid"
  files:
    js: "mermaid.min.js"
asciinema:
  version: "3.17.0"
  base: "https://cdn.jsdelivr.net/npm/asciinema-player@3.17.0/dist/bundle"
  local: "vendor/asciinema"
  files:
    js: "asciinema-player.min.js"
    css: "asciinema-player.css"
