# Terminology helpers. {{< term "shortcode" >}} renders the term with its
# definition as a tooltip; add entries here rather than in the Markdown.
shortcode:
  term: shortcode
  definition: A Hugo template invoked from Markdown to render a structured component.
page-bundle:
  term: page bundle
  definition: A Hugo content directory that keeps a page and its resources together.
module:
  term: module
  definition: A versioned Hugo dependency imported through the site's module configuration.
