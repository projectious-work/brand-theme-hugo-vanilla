# Example site. Consumes the theme as a Hugo Module; scripts/serve.sh runs it
# from the repository root with a replace directive back to ../..
baseURL = "https://projectious-work.github.io/brand-theme-hugo-vanilla/"
title = "projectious.work"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
enableGitInfo = true

[module]
  [[module.imports]]
    path = "github.com/projectious-work/brand-theme-hugo-vanilla"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    # The executable example lives two directories below this repository's
    # package.json. A normal consuming site uses node_modules/... directly.
    source = "../../node_modules/@tabler/icons/icons/outline"
    target = "assets/tabler-icons/outline"

# Tailwind v4 reads this inventory instead of scanning templates.
[build]
  [build.buildStats]
    enable = true

[security.exec]
  allow = ["^(dart-)?sass$", "^go$", "^git$", "^node$", "^postcss$", "^tailwindcss$"]

[pagination]
  pagerSize = 8

[taxonomies]
  tag = "tags"

[outputFormats.SearchIndex]
  mediaType = "application/json"
  baseName = "index"
  isPlainText = true
  notAlternative = true

[outputFormats.Print]
  mediaType = "text/html"
  baseName = "print"
  isHTML = true
  notAlternative = true
  permalinkable = true

[outputFormats.LLMS]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

# text/markdown is a built-in media type — declaring it again risks a suffix
# registration collision.
[outputFormats.Markdown]
  mediaType = "text/markdown"
  isPlainText = true
  permalinkable = true

[outputs]
  home = ["HTML", "RSS", "SearchIndex", "LLMS"]
  section = ["HTML", "RSS", "Print", "Markdown"]
  page = ["HTML", "Markdown"]

[markup]
  [markup.goldmark.renderer]
    # The theme is shortcode-based and needs no raw HTML in Markdown. Leaving
    # this false keeps the injection surface closed for every author on the site.
    # Turn it on only if you knowingly need inline HTML in content — no theme
    # feature requires it.
    unsafe = false
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [["\\[", "\\]"], ["$$", "$$"]]
      inline = [["\\(", "\\)"]]
  [markup.highlight]
    noClasses = false
    lineNos = false
    guessSyntax = true
    tabWidth = 2
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[[menus.main]]
  name = "Documentation"
  pageRef = "/docs"
  weight = 10
[[menus.main]]
  name = "Change log"
  pageRef = "/changelog"
  weight = 20

[params]
  description = "Documentation, release history and marketing pages on the projectious.work brand system."
  github = "https://github.com/projectious-work/brand-theme-hugo-vanilla"
  # A single string is appended to the page's content-relative path. For a
  # multilingual site the theme adds the language directory automatically; pass a
  # map keyed by language code when the repo layout differs per language.
  [params.editURL]
    default = "https://github.com/projectious-work/brand-theme-hugo-vanilla/edit/main/src/content/content/en/"
    de = "https://github.com/projectious-work/brand-theme-hugo-vanilla/edit/main/src/content/content/de/"
    fr = "https://github.com/projectious-work/brand-theme-hugo-vanilla/edit/main/src/content/content/fr/"
  version = "v0.3.4"
  darkSurface = "navy"   # navy dark mode; remove for the default terminal-surface dark
  codeTheme = "adaptive" # default; use "dark" for intentionally always-dark panels
  sidebarOpenDepth = 0   # collapsed initially; readers' choices then persist
  sidebarSections = ["docs"]  # sections that show the sidebar (and the mobile burger)
  # feedbackEndpoint = "https://example.org/api/feedback"
  # search = false            # disables the index, the header box and /search
  # accessibilityMenu = false # hides the accessibility selector
  # sidebarFilter = false     # hides the sidebar filter box
  # commandPalette = false    # disables Ctrl K and the shortcut help
  # versionProbe = false      # version links always land on that version's root
  # math = true               # loads KaTeX on every page

  [params.announcement]
    id = "v034"
    text = "v0.3.4 is out — stable composition APIs for data-driven sites."
    href = "/changelog/release-v0-3-4/"
    label = "Read the notes"

  # Third-party runtime assets come from exact pinned CDN versions — see
  # data/cdn.yaml. Set this true and mirror those files under static/vendor/
  # for deployments that prohibit public CDNs.
  selfHostAssets = false

  [params.build]
    tailwind = true

  [[params.versions]]
    label = "v0.3.4"
    url = "/"
    note = "latest"
  [[params.versions]]
    label = "v0.3.3"
    url = "v0.3.3/"
  [[params.versions]]
    label = "v0.3.2"
    url = "v0.3.2/"
  [[params.versions]]
    label = "v0.3.1"
    url = "v0.3.1/"
  # Only list versions that are actually published — the menu must never
  # advertise a known 404. Entries may be site-relative ("v0.2/") or absolute
  # ("https://docs.example.com/v0.2/"); both resolve through url.html, so a
  # project deployment keeps its base path.
  # [[params.versions]]
  #   label = "v0.2"
  #   url = "v0.2/"
  #   probe = false   # land on this version's root rather than the same path

[languages]
  # "label" is the current key; languageName is deprecated. languageDirection is
  # now "languagedirection" — set it to "rtl" for a right-to-left language and the
  # theme mirrors its sidebar rail, chevrons, step rail and file-tree connectors.
  [languages.en]
    label = "English"
    contentDir = "content/en"
    weight = 1
  [languages.de]
    label = "Deutsch"
    contentDir = "content/de"
    weight = 2
    title = "projectious.work"
    [languages.de.params]
      description = "Dokumentation und Versionshistorie auf Basis des projectious.work Markensystems."
  [languages.fr]
    label = "Français"
    contentDir = "content/fr"
    weight = 3
    title = "projectious.work"
    [languages.fr.params]
      description = "Documentation et historique des versions fondés sur le système de marque projectious.work."
