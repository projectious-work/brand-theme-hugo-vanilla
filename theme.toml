name = "Projectious"
license = "MIT"
licenselink = "https://github.com/projectious-work/hugo-theme-projectious/blob/main/LICENSE"
description = "Idiomatic Hugo theme implementing the projectious.work brand system: docs, blog, changelog, marketing pages, light/dark mode, client-side search, zero npm dependencies."
homepage = "https://github.com/projectious-work/hugo-theme-projectious"
tags = ["docs", "blog", "documentation", "brand", "dark-mode", "search"]
features = [
  "light/dark mode",
  "client-side search (no external service)",
  "docs sidebar navigation with prev/next",
  "blog with tags & RSS",
  "changelog timeline",
  "shortcodes for callouts, cards, buttons, terminal, stats, steps, quotes, tags/badges",
  "syntax highlighting via Chroma with brand token colors",
  "table of contents + reading time",
  "copy-to-clipboard code blocks and heading permalinks",
  "giscus comments",
  "multilingual (i18n) ready",
  "SEO meta + sitemap"
]
min_version = "0.121.0"

[author]
  name = "projectious.work"
  homepage = "https://projectious.work"
