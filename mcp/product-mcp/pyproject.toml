[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brand-theme-hugo-vanilla-mcp"
version = "0.1.0"
description = "Read-only MCP projection of the released Hugo theme contract"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
brand-theme-mcp = "product_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
