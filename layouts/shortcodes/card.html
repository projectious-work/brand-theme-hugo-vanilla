{{ $href := .Get "href" }}
<div class="card{{ if $href }} card--link{{ end }}">
  {{ if $href }}<a class="card__link" href="{{ $href }}">{{ end }}
  <div class="card__body">
    {{ with .Get "title" }}<div class="card__title">{{ . }}</div>{{ end }}
    {{ with .Get "meta" }}<div class="card__meta caption">{{ . }}</div>{{ end }}
    {{ with .Inner }}<div class="card__desc">{{ . | markdownify }}</div>{{ end }}
  </div>
  {{ if $href }}</a>{{ end }}
</div>
