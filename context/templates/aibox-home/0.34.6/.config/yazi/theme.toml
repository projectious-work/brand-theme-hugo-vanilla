# =============================================================================
# Yazi theme — generated by aibox CLI from the active theme palette
# Docs: https://yazi-rs.github.io/docs/configuration/theme
# =============================================================================

[mgr]
cwd = { fg = "#7E9CD8" }
hovered = { fg = "#FFFFFF", bg = "#3F4A64", bold = true }
preview_hovered = { fg = "#FFFFFF", bg = "#3F4A64", bold = true }
find_keyword = { fg = "#E6C384", bold = true }
find_position = { fg = "#957FB8" }
marker_selected = { fg = "#98BB6C" }
marker_copied = { fg = "#957FB8" }
marker_cut = { fg = "#E46876" }

[indicator]
parent = { fg = "#938AA9" }
current = { fg = "#000000", bg = "#7E9CD8", bold = true }
preview = { fg = "#7AA89F" }
padding = { open = "▐", close = "▌" }

[tabs]
active = { fg = "#000000", bg = "#7E9CD8", bold = true }
inactive = { fg = "#938AA9", bg = "#2E2E34", dim = true }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#000000", bg = "#98BB6C", bold = true }
normal_alt = { fg = "#98BB6C", bg = "#2E2E34", bold = true }
select_main = { fg = "#000000", bg = "#7E9CD8", bold = true }
select_alt = { fg = "#7E9CD8", bg = "#2E2E34", bold = true }
unset_main = { fg = "#000000", bg = "#957FB8", bold = true }
unset_alt = { fg = "#957FB8", bg = "#2E2E34", bold = true }

[status]
overall = { fg = "#DCD7BA", bg = "#2E2E34" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_type = { fg = "#7E9CD8" }
perm_read = { fg = "#E6C384" }
perm_write = { fg = "#E46876" }
perm_exec = { fg = "#98BB6C" }
perm_sep = { fg = "#938AA9" }
progress_label = { fg = "#DCD7BA", bold = true }
progress_normal = { fg = "#7E9CD8", bg = "#2E2E34" }
progress_error = { fg = "#E46876", bg = "#2E2E34", bold = true }

[input]
border = { fg = "#7E9CD8" }
title = { fg = "#7E9CD8", bg = "#1F1F28", bold = true }
value = { fg = "#DCD7BA", bg = "#1F1F28" }
selected = { fg = "#FFFFFF", bg = "#3F4A64" }

[pick]
border = { fg = "#7E9CD8" }
active = { fg = "#957FB8" }
inactive = { fg = "#938AA9", bg = "#1F1F28" }

[cmp]
border = { fg = "#7E9CD8" }
active = { fg = "#957FB8" }
inactive = { fg = "#938AA9", bg = "#1F1F28" }

[tasks]
border = { fg = "#7E9CD8" }
title = { fg = "#7E9CD8", bg = "#1F1F28", bold = true }
hovered = { fg = "#FFFFFF", bg = "#3F4A64", bold = true }

[which]
mask = { bg = "#2E2E34" }
cand = { fg = "#7AA89F" }
rest = { fg = "#938AA9" }
desc = { fg = "#957FB8" }
separator = "  "
separator_style = { fg = "#938AA9" }

[help]
on = { fg = "#7AA89F" }
run = { fg = "#957FB8" }
desc = { fg = "#DCD7BA", bg = "#1F1F28" }
hovered = { fg = "#FFFFFF", bg = "#3F4A64", bold = true }
footer = { fg = "#1F1F28", bg = "#DCD7BA" }

[git]
modified = { fg = "#E6C384", bold = true }
untracked = { fg = "#957FB8", italic = true }
added = { fg = "#98BB6C" }
deleted = { fg = "#E46876" }
updated = { fg = "#7E9CD8" }
ignored = { fg = "#938AA9", dim = true }

[filetype]
rules = [
    { url = "*/", fg = "#7E9CD8", bold = true },
    { url = "*.rs", fg = "#FFA066" },
    { url = "*.py", fg = "#E6C384" },
    { url = "*.js", fg = "#E6C384" },
    { url = "*.ts", fg = "#7E9CD8" },
    { url = "*.sh", fg = "#98BB6C" },
    { url = "*.toml", fg = "#7AA89F" },
    { url = "*.yaml", fg = "#7AA89F" },
    { url = "*.yml", fg = "#7AA89F" },
    { url = "*.json", fg = "#7AA89F" },
    { url = "*.kdl", fg = "#7AA89F" },
    { url = "*.html", fg = "#FFA066" },
    { url = "*.css", fg = "#7E9CD8" },
    { url = "*.md", fg = "#DCD7BA" },
    { url = "*.tex", fg = "#98BB6C" },
    { url = "*.typ", fg = "#98BB6C" },
    { url = "*.pdf", fg = "#E46876" },
    { url = "*.png", fg = "#957FB8" },
    { url = "*.jpg", fg = "#957FB8" },
    { url = "*.jpeg", fg = "#957FB8" },
    { url = "*.gif", fg = "#957FB8" },
    { url = "*.svg", fg = "#957FB8" },
    { url = "*.zip", fg = "#FFA066" },
    { url = "*.tar*", fg = "#FFA066" },
    { url = "*.gz", fg = "#FFA066" },
    { url = "*.gitignore", fg = "#938AA9" },
    { url = ".env*", fg = "#E46876" },
    { url = "Dockerfile*", fg = "#7E9CD8" },
    { url = "Makefile", fg = "#98BB6C" },
    { url = "Cargo.toml", fg = "#FFA066", bold = true },
    { url = "Cargo.lock", fg = "#938AA9" },
]
