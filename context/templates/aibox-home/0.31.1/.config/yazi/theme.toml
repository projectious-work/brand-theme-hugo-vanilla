# =============================================================================
# Yazi theme — generated by aibox CLI from the active theme palette
# Docs: https://yazi-rs.github.io/docs/configuration/theme
# =============================================================================

[mgr]
cwd = { fg = "#7E9CD8" }
hovered = { fg = "#1F1F28", bg = "#DCD7BA" }
preview_hovered = { bg = "#313244", underline = true }
find_keyword = { fg = "#FF9E3B", bold = true }
find_position = { fg = "#A7647E", italic = true }
marker_selected = { fg = "#98BB6C", bg = "#98BB6C" }
marker_copied = { fg = "#7E9CD8", bg = "#7E9CD8" }
marker_cut = { fg = "#C34043", bg = "#C34043" }

[tabs]
active = { fg = "#1F1F28", bg = "#7E9CD8", bold = true }
inactive = { fg = "#727169", bg = "#313244" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#1F1F28", bg = "#98BB6C", bold = true }
normal_alt = { fg = "#98BB6C", bg = "#313244", bold = true }
select_main = { fg = "#1F1F28", bg = "#7E9CD8", bold = true }
select_alt = { fg = "#7E9CD8", bg = "#313244", bold = true }
unset_main = { fg = "#1F1F28", bg = "#A7647E", bold = true }
unset_alt = { fg = "#A7647E", bg = "#313244", bold = true }

[status]
overall = { fg = "#DCD7BA", bg = "#313244" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_type = { fg = "#7E9CD8" }
perm_read = { fg = "#FF9E3B" }
perm_write = { fg = "#C34043" }
perm_exec = { fg = "#98BB6C" }
perm_sep = { fg = "#727169" }
progress_label = { fg = "#DCD7BA", bold = true }
progress_normal = { fg = "#7E9CD8", bg = "#313244" }
progress_error = { fg = "#C34043", bg = "#313244" }

[input]
border = { fg = "#7E9CD8" }
title = { fg = "#7E9CD8", bg = "#1F1F28", bold = true }
value = { fg = "#DCD7BA", bg = "#1F1F28" }
selected = { reversed = true }

[pick]
border = { fg = "#7E9CD8" }
active = { fg = "#A7647E" }
inactive = { fg = "#727169", bg = "#1F1F28" }

[cmp]
border = { fg = "#7E9CD8" }
active = { fg = "#A7647E" }
inactive = { fg = "#727169", bg = "#1F1F28" }

[tasks]
border = { fg = "#7E9CD8" }
title = { fg = "#7E9CD8", bg = "#1F1F28", bold = true }
hovered = { bg = "#313244", underline = true }

[which]
mask = { bg = "#313244" }
cand = { fg = "#7AA89F" }
rest = { fg = "#727169" }
desc = { fg = "#A7647E" }
separator = "  "
separator_style = { fg = "#727169" }

[help]
on = { fg = "#7AA89F" }
run = { fg = "#A7647E" }
desc = { fg = "#DCD7BA", bg = "#1F1F28" }
hovered = { bg = "#313244", bold = true }
footer = { fg = "#1F1F28", bg = "#DCD7BA" }

[git]
modified = { fg = "#FF9E3B" }
untracked = { fg = "#A7647E" }
added = { fg = "#98BB6C" }
deleted = { fg = "#C34043" }
updated = { fg = "#7E9CD8" }
ignored = { fg = "#727169" }

[filetype]
rules = [
    { url = "*/", fg = "#7E9CD8", bold = true },
    { url = "*.rs", fg = "#D27E99" },
    { url = "*.py", fg = "#FF9E3B" },
    { url = "*.js", fg = "#FF9E3B" },
    { url = "*.ts", fg = "#7E9CD8" },
    { url = "*.sh", fg = "#98BB6C" },
    { url = "*.toml", fg = "#7AA89F" },
    { url = "*.yaml", fg = "#7AA89F" },
    { url = "*.yml", fg = "#7AA89F" },
    { url = "*.json", fg = "#7AA89F" },
    { url = "*.kdl", fg = "#7AA89F" },
    { url = "*.html", fg = "#D27E99" },
    { url = "*.css", fg = "#7E9CD8" },
    { url = "*.md", fg = "#DCD7BA" },
    { url = "*.tex", fg = "#98BB6C" },
    { url = "*.typ", fg = "#98BB6C" },
    { url = "*.pdf", fg = "#C34043" },
    { url = "*.png", fg = "#A7647E" },
    { url = "*.jpg", fg = "#A7647E" },
    { url = "*.jpeg", fg = "#A7647E" },
    { url = "*.gif", fg = "#A7647E" },
    { url = "*.svg", fg = "#A7647E" },
    { url = "*.zip", fg = "#D27E99" },
    { url = "*.tar*", fg = "#D27E99" },
    { url = "*.gz", fg = "#D27E99" },
    { url = "*.gitignore", fg = "#727169" },
    { url = ".env*", fg = "#C34043" },
    { url = "Dockerfile*", fg = "#7E9CD8" },
    { url = "Makefile", fg = "#98BB6C" },
    { url = "Cargo.toml", fg = "#D27E99", bold = true },
    { url = "Cargo.lock", fg = "#727169" },
]
