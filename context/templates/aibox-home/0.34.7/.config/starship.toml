# aibox starship config — pastel powerline preset
# One-line prompt inspired by https://starship.rs/presets/#pastel-powerline.
palette = "aibox"

format = """
[](fg:#7E9CD8)\
$directory\
[](fg:#7E9CD8 bg:#98BB6C)\
$git_branch\
$git_status\
[](fg:#98BB6C bg:#FFA066)\
$python\
$rust\
$nodejs\
$golang\
[](fg:#FFA066 bg:#1F1F28)\
$cmd_duration\
$character"""

[directory]
style = "bold bg:#7E9CD8 fg:#1F1F28"
format = "[ $path ]($style)"
truncation_length = 3
truncate_to_repo = true

[git_branch]
style = "bg:#98BB6C fg:#1F1F28"
symbol = " "
format = "[ $symbol$branch ]($style)"

[git_status]
style = "bg:#98BB6C fg:#1F1F28"
format = "[$all_status$ahead_behind ]($style)"
ahead = "⇡$count"
behind = "⇣$count"
diverged = "⇕⇡$ahead_count⇣$behind_count"
modified = "!$count"
staged = "+$count"
untracked = "?$count"

[python]
style = "bg:#FFA066 fg:#1F1F28"
format = "[ $symbol$version ]($style)"
[rust]
style = "bg:#FFA066 fg:#1F1F28"
format = "[ $symbol$version ]($style)"
[nodejs]
style = "bg:#FFA066 fg:#1F1F28"
format = "[ $symbol$version ]($style)"
[golang]
style = "bg:#FFA066 fg:#1F1F28"
format = "[ $symbol$version ]($style)"

[cmd_duration]
style = "fg:#938AA9"
min_time = 2_000
format = "[ $duration ]($style)"

[character]
success_symbol = "[❯](bold fg:#7E9CD8) "
error_symbol = "[❯](bold fg:#E46876) "

[palettes.aibox]
bg = "#1F1F28"
fg = "#DCD7BA"
accent = "#7E9CD8"
accent_fill = "#7E9CD8"
